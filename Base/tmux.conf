# ============================================================================
# 1. PREFIX & CORE KEYBINDINGS
# ============================================================================

# Unbind the default prefix (Ctrl+b)
unbind C-b

# Set the new prefix to Ctrl+s
set -g prefix C-s

# Make Ctrl+s send the prefix when pressed twice
bind C-s send-prefix

# Reload tmux config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"


# ============================================================================
# 2. GENERAL SETTINGS
# ============================================================================

# Increase history limit to 50,000 lines
set -g history-limit 50000

# Enable mouse mode (scrolling, selecting panes, resizing)
set -g mouse on

# Sets the terminal to support 24-bit colours (assuming the terminal can)
set-option -sa terminal-overrides ",xterm*:Tc"


# ============================================================================
# 3. PANE & WINDOW MANAGEMENT
# ============================================================================

# Split panes using | and - and open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Create new window in the current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes using Prefix + h/j/k/l (Vim-style)
# The -r flag allows repeating the key without pressing the prefix again
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R


# ============================================================================
# 4. PLUGINS (Tmux Plugin Manager)
# ============================================================================

# Plugin manager itself
set -g @plugin 'tmux-plugins/tpm'

# Save and restore tmux sessions across restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Tmux terminal logging
set -g @plugin 'tmux-plugins/tmux-logging'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'


# ============================================================================
# 5. UI & STATUS BAR (Starship Theme)
# ============================================================================

# Base status bar colors and alignment
set -g status-style "bg=black,fg=white"
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 100

# Left: [ACTIVE] flag (shows while prefix is awaiting next key) + session name (purple, like username)
set -g status-left "#{?client_prefix,#[fg=yellow]#[bold][ACTIVE] #[default],}#[bold,fg=#A200FF]#S #[fg=white]|#[default] "

# Window list: plain, current window highlighted green (like your character symbol)
setw -g window-status-format "#[fg=white]#I:#W"
setw -g window-status-current-format "#[bold,fg=green]#I:#W"
setw -g window-status-separator "  "

# Right: host | ip | ssh flag | shlvl depth | time — mirrors your Starship line 1
set -g status-right "#[fg=white,bold]#h #[fg=cyan,bold]@#(hostname -I | awk '{print $1}') #{?SSH_CONNECTION,#[fg=#FF8700]#[bold][SSH] ,}#[fg=cyan]depth:#{?#{==:#{SHLVL},1},0,#{SHLVL}} #[fg=white,bold]%H:%M"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# Renumber windows automatically when one is closed (keeps them in order)
set -g renumber-windows on



# ============================================================================
# 6. PANE BORDERS & MESSAGES
# ============================================================================

# Pane borders: white normal, purple active
set -g pane-border-style "fg=white"
set -g pane-active-border-style "fg=#A200FF,bold"

# Pane border status showing path and active indicator (top)
set -g pane-border-status top
set -g pane-border-format " #[fg=white]#{pane_current_path} #{?pane_active,#[fg=green]●,#[fg=white]○} "

# Message line styling
set -g message-style "bg=black,fg=cyan,bold"

# Clock mode color
setw -g clock-mode-colour cyan



# ============================================================================
# 7. COPY MODE (select only, copy with l)
# ============================================================================

# Drag select: keep the selection highlighted, don't copy
bind -T copy-mode    MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# Copy selection to clipboard, exit copy mode (back to the prompt),
# and replace the ENTIRE status line with a purple bold "Copied!" for 1 second
bind -T copy-mode    l send -X copy-pipe-and-cancel "xclip -selection clipboard -i >/dev/null 2>&1" \; run-shell -b '[ -n "$(tmux show -gqv @cp_busy)" ] && exit 0; tmux set -g @cp_busy 1; tmux set -g @sf_orig "$(tmux show -gv "status-format[0]")"; tmux set -g "status-format[0]" "#[bold,fg=#A200FF]Copied!"; tmux refresh-client -S; sleep 1; tmux set -g "status-format[0]" "$(tmux show -gv @sf_orig)"; tmux set -gu @cp_busy; tmux refresh-client -S'
bind -T copy-mode-vi l send -X copy-pipe-and-cancel "xclip -selection clipboard -i >/dev/null 2>&1" \; run-shell -b '[ -n "$(tmux show -gqv @cp_busy)" ] && exit 0; tmux set -g @cp_busy 1; tmux set -g @sf_orig "$(tmux show -gv "status-format[0]")"; tmux set -g "status-format[0]" "#[bold,fg=#A200FF]Copied!"; tmux refresh-client -S; sleep 1; tmux set -g "status-format[0]" "$(tmux show -gv @sf_orig)"; tmux set -gu @cp_busy; tmux refresh-client -S'

# Left click in copy mode: exit copy mode, discarding any selection
bind -T copy-mode    MouseDown1Pane select-pane \; send -X cancel
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X cancel

# Double click (word) and triple click (line): select only
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line }

bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line
