# =============================================================================
#  ctf-tmuxp.yaml  —  tmuxp session template for CTF environments
#
#  Usage:
#    tmuxp load ctf-tmuxp.yaml
#
#  Or generate a filled-in version on the fly via ctf-launch.sh (recommended).
#  This file is a reference/static template — edit SESSION, OVPN_PATH, and
#  TARGET before loading, or use the shell script which does this automatically.
# =============================================================================

session_name: HTB                          # <-- change to provider (THM/HTB/OFFSEC)

windows:
  # ── Window 0: VPN connection ────────────────────────────────────────────────
  - window_name: VPN
    layout: main-vertical
    panes:
      - shell_command:
          - sudo openvpn --config ~/.vpns/HTB-CTF.ovpn   # <-- set your ovpn path

  # ── Window 1: Working shell on Desktop ─────────────────────────────────────
  - window_name: Shell
    start_directory: ~/Desktop
    panes:
      - shell_command:
          - clear

  # ── Window 2: Nmap (uncomment and fill TARGET when using -t) ───────────────
