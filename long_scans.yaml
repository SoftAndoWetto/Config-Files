session_name: long_scans

options:
  remain-on-exit: true

windows:  
  - window_name: SMB_Anon
    panes:
      - shell_command:
          - >-
            cd ~/pentest2026/{NAME}/SMB/Snaffler/anonymous &&
            mkdir -p run_logs && {
              snaffler --rule-dir ~/pentest2026/{NAME}/Snaffler-Rules/Snaffler_Rules
                --username '' --password '' --domain {DOMAIN} --dc-host {DC_IP}
                2>&1 | tee run_logs/output.log;
              echo $? > run_logs/exit.txt;
            };
            if [ -f snaffler.db ]; then mv snaffler.db run_logs/snaffler.db;
            else echo 'DB missing' >> run_logs/output.log; fi

  - window_name: SMB_Auth
    panes:
      - shell_command:
          - >-
            cd ~/pentest2026/{NAME}/SMB/Snaffler/pentest &&
            mkdir -p run_logs && {
              snaffler --rule-dir ~/pentest2026/{NAME}/Snaffler-Rules/Snaffler_Rules
                --username '{DOMAIN_USERNAME}' --password '{PASSWORD}' --domain {DOMAIN} --dc-host {DC_IP}
                2>&1 | tee run_logs/output.log;
              echo $? > run_logs/exit.txt;
            };
            if [ -f snaffler.db ]; then mv snaffler.db run_logs/snaffler.db;
            else echo 'DB missing' >> run_logs/output.log; fi

  - window_name: FTP_Anon
    panes:
      - shell_command:
          - >-
            cd ~/pentest2026/{NAME}/FTP/Snaffler/anonymous &&
            mkdir -p run_logs && {
              snaffler --rule-dir ~/pentest2026/{NAME}/Snaffler-Rules/Snaffler_Rules
                --username '' --password '' --domain {DOMAIN} --dc-host {DC_IP}
                --ftp-file ~/pentest2026/{NAME}/livehosts.txt
                2>&1 | tee run_logs/output.log;
              echo $? > run_logs/exit.txt;
            };
            if [ -f snaffler.db ]; then mv snaffler.db run_logs/snaffler.db;
            else echo 'DB missing' >> run_logs/output.log; fi

  - window_name: FTP_Auth
    panes:
      - shell_command:
          - >-
            cd ~/pentest2026/{NAME}/FTP/Snaffler/pentest &&
            mkdir -p run_logs && {
              snaffler --rule-dir ~/pentest2026/{NAME}/Snaffler-Rules/Snaffler_Rules
                --username '{DOMAIN_USERNAME}' --password '{PASSWORD}' --domain {DOMAIN} --dc-host {DC_IP}
                --ftp-file ~/pentest2026/{NAME}/livehosts.txt
                2>&1 | tee run_logs/output.log;
              echo $? > run_logs/exit.txt;
            };
            if [ -f snaffler.db ]; then mv snaffler.db run_logs/snaffler.db;
            else echo 'DB missing' >> run_logs/output.log; fi
