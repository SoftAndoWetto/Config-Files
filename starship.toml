# ╔══════════════════════════════════════════════════════════╗
# ║  Starship Prompt — Pentest Edition (Plain, no glyphs)     ║
# ║  Line 1: scope/host/ip | path/git/env                     ║
# ║  Line 2: state flags | jobs/shlvl | fill | duration/status ║
# ║  Line 3: character                                         ║
# ╚══════════════════════════════════════════════════════════╝

add_newline = true

format = """${custom.ligolo} | (${custom.kerb_valid}${custom.kerb_expired}$python| )$username | $hostname${custom.localip}${custom.ssh}[|](bold white) $directory$git_branch$git_status$docker_context${custom.shlvl}$fill$cmd_duration$status${custom.proxy}$jobs
$character"""

# ───────────────────────── Identity ─────────────────────────
[username]
style_user = "bold fg:#A200FF"
style_root = "bold red"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
style    = "bold white"
format   = "[$hostname]($style)"
disabled = false

[localip]
disabled = true

[custom.localip]
command = """
for i in tun0 eth0 eth1 ens3; do
  ip=$(ip -o -4 addr show dev "$i" 2>/dev/null | awk '{print $4}' | cut -d/ -f1 | head -n1)
  if [ -n "$ip" ]; then
    echo "@$ip"
    break
  fi
done
"""
when = "true"
style = "bold cyan"
format = "[$output]($style) "
disabled = false

[custom.ssh]
when = "test -n \"$SSH_CONNECTION\""
command = "echo ' [SSH]'"
style = "bold fg:#FF8700"
format = "[$output]($style) "
shell = ["bash", "--noprofile", "--norc"]

# ─────────────────────── Location (right) ───────────────────

[directory]
style             = "bold fg:white"
repo_root_style   = "bold fg:green"
truncation_length = 3
truncate_to_repo  = false
read_only         = "  locked"
read_only_style   = "bold fg:red"
home_symbol       = "~"
format            = "[$path]($style)[$read_only]($read_only_style) "
repo_root_format  = "[$before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# ─────────────────────── Timing / exit state ─────────────────
[fill]
symbol = " "
style  = "bold black"

[cmd_duration]
min_time = 2000
style  = "bold yellow"
format = "[took $duration]($style) "

[status]
disabled       = false
success_symbol = ""
symbol         = "exit:"
style          = "bold red"
format         = "[$symbol$status]($style) "

# ────────────────────── VCS / Environment ────────────────────
[git_branch]
symbol = "git:"
style  = "bold white"
format = "[$symbol$branch]($style) "

[git_status]
style  = "bold red"
format = "([$all_status$ahead_behind]($style)) "

[docker_context]
symbol          = "docker:"
style           = "bold white"
format          = "[$symbol$context]($style) "
disabled        = false
only_with_files = true

[python]
symbol = "py:"
style  = "bold white"
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '

# ──────────────────────── Pentest extras ─────────────────────
[custom.proxy]
when    = "test -n \"$HTTP_PROXY\" -o -n \"$http_proxy\""
command = "echo proxy:on"
style   = "bold cyan"
format  = "[$output]($style) "
shell   = ["bash", "--noprofile", "--norc"]

[custom.scope]
when    = "test -n \"$DOMAIN\""
command = "echo [$DOMAIN]"
style   = "bold white"
format  = "[$output]($style) "
shell   = ["bash", "--noprofile", "--norc"]

[jobs]
symbol           = "jobs:"
style            = "bold cyan"
number_threshold = 1
format           = "[$symbol$number]($style) "

# ──────────────────────── Kerberos TGT ───────────────────────
[custom.kerb_valid]
when    = "klist -s 2>/dev/null"
command = "echo \"$(klist 2>/dev/null | awk -F': ' '/Default principal/{print $2; exit}' | cut -d@ -f1) : $(date -d \"$(klist 2>/dev/null | awk '/krbtgt/{print $3, $4; exit}')\" '+%d/%m %H:%M' 2>/dev/null)\""
style   = "bold green"
format  = "[$output]($style) "
shell   = ["bash", "--noprofile", "--norc"]

[custom.kerb_expired]
when    = "klist 2>/dev/null | grep -qi '^Ticket cache' && ! klist -s 2>/dev/null"
command = "echo \"$(klist 2>/dev/null | awk -F': ' '/Default principal/{print $2; exit}' | cut -d@ -f1) : EXPIRED\""
style   = "bold red"
format  = "[$output]($style) "
shell   = ["bash", "--noprofile", "--norc"]

# ─────────────────────── Prompt character ────────────────────
[character]
success_symbol = "[>](bold green)"
error_symbol   = "[>](bold red)"
vimcmd_symbol  = "[<](bold green)"



[custom.ligolo]
when    = "ip link show 2>/dev/null | grep -qi 'ligolo'"
command = "ip route show dev ligolo 2>/dev/null | awk '{print $1; exit}'"
style   = "bold fg:#FFFFFF"
format  = "[Ligolo \\[$output\\]]($style) | "
shell   = ["bash", "--noprofile", "--norc"]

[shlvl]
disabled = true

[custom.shlvl]
shell    = ["bash", "--noprofile", "--norc"]
when     = """
lvl=${SHELL_DEPTH:-1}
[ -n "$TMUX" ] && lvl=$((lvl - 1))
[ "$lvl" -ge 2 ]
"""
command  = """
lvl=${SHELL_DEPTH:-1}
[ -n "$TMUX" ] && lvl=$((lvl - 1))
echo "$lvl"
"""
style    = "bold fg:red"
format   = "[shlvl:$output]($style) "
disabled = false
